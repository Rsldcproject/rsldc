{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajasthan Skill Demand Aggregation Survey</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* Animated background circles */
    body::before,
    body::after {
        content: '';
        position: fixed;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        animation: float 12s ease-in-out infinite;
        z-index: 0;
    }
    body::before {
        width: 350px;
        height: 350px;
        top: -120px;
        left: -120px;
    }
    body::after {
        width: 400px;
        height: 400px;
        bottom: -150px;
        right: -150px;
        animation-delay: 3s;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-30px) scale(1.05); }
    }

    .container {
        position: relative;
        z-index: 2;
        max-width: 950px;
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 50px 40px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        animation: fadeInUp 0.9s ease;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Logos + Heading row ===== */
    .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
    }

    .logo {
        width: 90px;
        height: 90px;
        object-fit: contain;
        border-radius: 50%;
        background: #fff;
        padding: 8px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        flex-shrink: 0;
        transition: transform 0.3s ease;
    }

    .logo:hover {
        transform: scale(1.08) rotate(5deg);
    }

    .heading-block {
        text-align: center;
        flex: 1;
    }

    .heading-block .welcome {
        display: block;
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ffe;
        opacity: 0.9;
        margin-bottom: 5px;
    }

    .heading-block h1 {
        font-size: 1.9rem;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.3;
        text-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
    }

    /* ===== Divider ===== */
    .divider {
        height: 2px;
        width: 120px;
        background: linear-gradient(90deg, transparent, #ffd700, transparent);
        margin: 0 auto 40px;
        border-radius: 2px;
    }

    /* ===== Buttons ===== */
    .buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 22px;
        margin-top: 20px;
    }

    .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 30px 20px;
        border-radius: 18px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn .icon {
        font-size: 2rem;
        display: block;
        transition: transform 0.3s ease;
    }

    .btn:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .btn:hover .icon {
        transform: scale(1.2) rotate(-6deg);
    }

    /* Button 1 - Survey */
    .btn-survey {
        background: linear-gradient(135deg, #ff6b6b, #ee0979);
    }
    .btn-survey::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #ee0979, #ff6b6b);
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: -1;
    }
    .btn-survey:hover::before { opacity: 1; }

    /* Button 2 - Association */
    .btn-association {
        background: linear-gradient(135deg, #00c9ff, #0072ff);
    }

    /* Button 3 - Govt */
    .btn-govt {
        background: linear-gradient(135deg, #f7971e, #ffd200);
        color: #222;
    }
    .btn-govt .icon { color: #222; }

    /* ===== Footer text ===== */
    .footer-note {
        text-align: center;
        margin-top: 40px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.85rem;
        letter-spacing: 0.5px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
        .container { padding: 35px 20px; }
        .heading-block h1 { font-size: 1.4rem; }
        .heading-block .welcome { font-size: 0.95rem; letter-spacing: 2px; }
        .logo { width: 65px; height: 65px; padding: 6px; }
        .btn { padding: 22px 15px; font-size: 1rem; }
        .btn .icon { font-size: 1.6rem; }
    }

    @media (max-width: 480px) {
        .header-row { flex-direction: column; gap: 12px; }
        .logo { width: 60px; height: 60px; }
        .heading-block h1 { font-size: 1.2rem; }
    }
</style>
</head>
<body>

<div class="container">

    <!-- Logo + Heading + Logo -->
    <div class="header-row">
        <!-- Left Logo -->
        <img src="{% static 'img/rsldc-logo.png' %}" alt="Left Logo" class="logo">

        <div class="heading-block">
            <span class="welcome">Welcome to</span>
            <h1>Rajasthan Skill Demand<br>Aggregation Survey</h1>
        </div>

        <!-- Right Logo -->
        <img src="{% static 'img/images.jpg.jpeg' %}" alt="Right Logo" class="logo">
    </div>

    <div class="divider"></div>

    <!-- Buttons -->
    <div class="buttons">

        <a href="{% url 'survey:survey_form' %}" class="btn btn-survey">
            <span class="icon">📝</span>
            <span>Survey Form</span>
        </a>

        <a href="{% url 'survey:association_form' %}" class="btn btn-association">
            <span class="icon">🏢</span>
            <span>Association Form</span>
        </a>

        <a href="{% url 'survey:govt_form' %}" class="btn btn-govt">
            <span class="icon">🏛️</span>
            <span>Govt Form</span>
        </a>

    </div>

    <p class="footer-note">© 2025 Rajasthan Skill Development — All Rights Reserved</p>
</div>

</body>
</html>
